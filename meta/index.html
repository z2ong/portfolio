<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>
    <link rel = "stylesheet" href = "../style.css">
</head>

<body>
    <h1>Meta</h1>
    <p>This page includes stats about the code of this website.</p>

    <div id="commit-stats">
        <h2>Summary Stats</h2>
        <dl>
            <dt>TOTAL LOC</dt>
            <dd id="stat-loc">-</dd>

            <dt>COMMITS</dt>
            <dd id="stat-commits">-</dd>

            <dt>FILES</dt>
            <dd id="stat-files">-</dd>

            <dt>MAX DEPTH</dt>
            <dd id="stat-depth">-</dd>
        </dl>
    </div>

    <label id = "commit-label">Show commits until:
        <input type="range" id ="commit-progress" min="0" max="100" value="0">
        <time id="commit-time"><em>(any time)</em></time>
    </label>

    <div id="scrolly-1">
        <div id="scatter-story">Here is my commit log:</div>
        <div id="scatter-plot">
            <h2>Commits By Time of Day</h2>
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>
    </dl>
    
    <dl id="files"></dl>

    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</body>
